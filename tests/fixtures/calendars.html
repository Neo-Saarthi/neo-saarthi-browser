<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Local calendar fixtures</title>
<style>body{font-family:sans-serif;padding:30px}.field{margin:10px}#calendar{position:absolute;left:40px;top:100px;width:400px;background:#eee;padding:16px}button,select{padding:7px;margin:3px}</style>
<div class="field"><label for="from">From Date</label><input id="from" readonly value="01-Oct-2026"><button aria-label="Open calendar" onclick="openCalendar()">Calendar</button></div>
<div class="field"><label for="to">To Date</label><input id="to" readonly value="24-Oct-2026"><button aria-label="Open calendar" onclick="window.wrongCalendar=true">Calendar</button></div>
<button onclick="window.submitted=true">Next</button>
<div id="host"></div>
<script>
const names=['January','February','March','April','May','June','July','August','September','October','November','December'];
let mode='grid', year=2026, month=9, stage='days', range=2004;
window.events=[];
function configure(layout){mode=layout;year=2026;month=9;stage='days';range=2004;document.getElementById('from').value='01-Oct-2026';document.getElementById('host').innerHTML='';window.events=[];window.submitted=false;window.wrongCalendar=false;}
function openCalendar(){window.events.push('open');render();}
function chooseYear(value){window.events.push('year:'+value);year=value;stage=['grid','cams'].includes(mode)?'months':'days';render();}
function chooseMonth(value){window.events.push('month:'+value);month=value;stage='days';render();}
function chooseDay(day){window.events.push('day:'+day);document.getElementById('from').value=mode==='iso'?`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`:`${String(day).padStart(2,'0')}-${names[month].slice(0,3)}-${year}`;document.getElementById('host').innerHTML='';}
function render(){
 let content=mode==='cams'?`<h3>01-${names[month].slice(0,3).toUpperCase()}-${year}</h3>`:`<h3>${names[month]} ${year}</h3>`;
 if(mode==='vision'){
  content='<canvas width="380" height="160" onclick="year=1990;month=0;chooseDay(1)"></canvas>';
 }else if(['grid','cams'].includes(mode)&&stage==='years'){
  content='<h3>Choose year</h3><button aria-label="Previous years" onclick="range-=24;render()">Previous</button><button aria-label="Next years" onclick="range+=24;render()">Next</button>';
  for(let value=range;value<range+24;value++)content+=`<button onclick="chooseYear(${value})">${value}</button>`;
 }else if(['grid','cams'].includes(mode)&&stage==='months'){
  content=`<h3>${year}</h3>`+names.map((name,index)=>`<button ${mode==='cams'?`aria-label="01-${name.slice(0,3)}-${year}"`:''} onclick="chooseMonth(${index})">${name.slice(0,3)}</button>`).join('');
 }else{
  if(mode==='grid')content+='<button aria-label="Choose month and year" onclick="stage=\'years\';render()">Choose month and year</button>';
  if(mode==='cams')content+='<button aria-label="Choose date" onclick="stage=\'years\';render()">Choose date</button>';
  if(mode==='dropdown'){
   content+='<select aria-label="Year" onchange="chooseYear(Number(this.value))">';
   for(let value=1980;value<=2030;value++)content+=`<option value="${value}" ${value===year?'selected':''}>${value}</option>`;
   content+='</select><select aria-label="Month" onchange="chooseMonth(Number(this.value))">'+names.map((name,index)=>`<option value="${index}" ${index===month?'selected':''}>${name}</option>`).join('')+'</select>';
  }
  content+='<button aria-label="Previous month" onclick="month--;if(month<0){month=11;year--;}render()">Previous</button><button aria-label="Next month" onclick="month++;if(month>11){month=0;year++;}render()">Next</button>';
  for(let day=1;day<=new Date(year,month+1,0).getDate();day++)content+=`<button ${mode==='iso'?`aria-label="${names[month]} ${day}, ${year}"`:mode==='cams'?`aria-label="${String(day).padStart(2,'0')}-${names[month].slice(0,3)}-${year}"`:''} onclick="chooseDay(${day})">${day}</button>`;
 }
 const marker=mode==='cams'?`<${stage==='years'?'mat-multi-year-view':stage==='months'?'mat-year-view':'mat-month-view'}></${stage==='years'?'mat-multi-year-view':stage==='months'?'mat-year-view':'mat-month-view'}>`:'';
 document.getElementById('host').innerHTML=`<div id="calendar" role="dialog" aria-label="Choose date" class="mat-datepicker-content">${marker}${content}</div>`;
 if(mode==='vision'){
  const ctx=document.querySelector('canvas').getContext('2d');ctx.font='20px sans-serif';ctx.fillText('January 1990',15,35);ctx.fillText('1',30,80);
 }
}
document.addEventListener('keydown',event=>{if(event.key==='Escape')document.getElementById('host').innerHTML='';});
</script>
</html>
