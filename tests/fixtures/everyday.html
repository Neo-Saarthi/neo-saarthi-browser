<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Everyday browser tasks</title><style>body{font:18px Arial,sans-serif;max-width:720px;margin:60px auto;padding:20px;color:#24222a}label{display:block;margin:20px 0 8px}input{display:block;font:20px Arial;padding:12px;width:90%;margin:8px 0 18px}button{font:18px Arial;padding:12px 22px}section{padding:28px;border:1px solid #ddd}#saved{margin-top:22px;color:#345738}</style></head><body><h1>Personal notebook</h1><p>This local notebook is a safe test page. You can enter a short note, save it and read the confirmation below. It does not send messages, create financial transactions or connect to another website.</p><section><h2>Write a note</h2><label for="note">Note</label><input id="note" autocomplete="off"><button id="save">Save note</button><p id="saved" role="status">No note has been saved.</p></section><script>window.changes=0;document.querySelector('#note').addEventListener('input',()=>window.changes++);document.querySelector('#save').onclick=()=>{window.changes++;document.querySelector('#saved').textContent='Note saved: '+document.querySelector('#note').value;document.title='Note saved';};</script></body></html>
